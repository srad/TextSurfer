<!doctype html>
<html>
  <head>
    <title>borders</title>
    <style>
      .card { border: solid; padding: 1px; margin-bottom: 1px }
      .fixed { border: solid; width: 20px; box-sizing: border-box }
      .none { border: none }
    </style>
  </head>
  <body>
    <div class="card">bordered card content</div>
    <div class="fixed">fixed width border box</div>
    <div class="none">no border here</div>
  </body>
</html>
