<!doctype html>
<html>
  <head>
    <title>links</title>
    <style>
      a.plain { color: #00ff00 }
      .dark { color: #000010 }
    </style>
  </head>
  <body>
    <p>Visit <a href="https://example.com/">the example site</a> for details.</p>
    <p><a class="plain" href="/local">a locally styled link</a> and <a>an anchor without href</a>.</p>
    <p class="dark">nearly black text on the field background</p>
    <p><img src="cat.png" alt="a cat"> and <img src="dog.png"></p>
  </body>
</html>
