<!doctype html>
<html>
  <head>
    <style>
      table { border-collapse: collapse }
      td, th { border: solid #00ffff; padding: 1px }
      .wide { border-bottom: double #ffff00 }
      .left { border-right: dashed #ff00ff }
    </style>
  </head>
  <body>
    <table>
      <tr><th class="wide" colspan="2">Inventory</th></tr>
      <tr><td class="left" rowspan="2">Tools</td><td>Hammer</td></tr>
      <tr><td>Saw</td></tr>
    </table>
  </body>
</html>
