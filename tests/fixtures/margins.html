<!doctype html>
<html>
  <head>
    <title>margins</title>
    <style>
      .inset { margin-left: 4px; padding-left: 2px }
      .tight { margin-bottom: 0 }
    </style>
  </head>
  <body>
    <p class="tight">flush paragraph</p>
    <p class="inset">indented by margin and padding</p>
    <blockquote>quoted text keeps its left margin</blockquote>
    <div>plain block</div>
  </body>
</html>
