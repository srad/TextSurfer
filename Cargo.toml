[package]
name = "textsurf"
version = "0.0.1"
edition = "2024"
rust-version = "1.88"
description = "A text-mode web browser for the terminal."

[dependencies]
ratatui = "0.30.2"
url = "2.5.8"
slotmap = "1.1.1"
unicode-width = "0.2.2"
thiserror = "2.0.20"
html5ever = "0.39.0"
encoding_rs = "0.8.35"
ureq = { version = "3.4.0", features = ["platform-verifier"] }
boa_engine = { version = "0.21.1", optional = true }

[features]
default = []
js = ["dep:boa_engine"]

[dev-dependencies]
insta = "1.48.0"
proptest = "1.11.0"
pretty_assertions = "1.4.1"