[package]
name = "textsurfer"
version = "0.0.1"
edition = "2024"
rust-version = "1.90"
description = "A text-mode web browser for the terminal."

[dependencies]
arboard = { version = "3.6.1", default-features = false }
clap = { version = "4.6.6", features = ["derive"] }
crossbeam-channel = "0.5.16"
cssparser = "0.37.0"
cssparser-color = "0.5.0"
indextree = { version = "4.9.0", default-features = false }
mediatype = "0.23.0"
precomputed-hash = "0.1.1"
ratatui = { version = "0.30.2", features = ["scrolling-regions"] }
selectors = "0.40.0"
taffy = { version = "0.14.0", default-features = false, features = ["std", "taffy_tree", "block_layout", "content_size", "flexbox", "grid", "float_layout", "calc", "strict_provenance"] }
textwrap = { version = "0.16.2", default-features = false, features = ["unicode-linebreak", "unicode-width"] }
unicode-segmentation = "1.13.3"
url = "2.5.8"
unicode-width = "0.2.2"
thiserror = "2.0.20"
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-chrome = "0.7.2"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["env-filter", "fmt"] }
html5ever = "0.39.0"
encoding_rs = "0.8.35"
image = { version = "0.25.10", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
ratatui-image = { version = "11.0.6", default-features = false, features = ["crossterm"] }
ureq = { version = "3.4.0", features = ["platform-verifier"] }
boa_engine = { version = "0.21.1", optional = true }
softbuffer = { version = "0.4.8", optional = true }
unifont-bitmap = { version = "1.0.0", optional = true }
winit = { version = "0.30.13", optional = true }
app_units = { version = "0.7.8", optional = true }
atomic_refcell = { version = "0.1.14", optional = true }
euclid = { version = "0.22.11", optional = true }
servo_arc = { version = "0.4.3", optional = true }
stylo = { version = "0.20.0", optional = true }
stylo_dom = { version = "0.20.0", optional = true }
stylo_traits = { version = "0.20.0", optional = true }
typed-arena = { version = "2.0.2", optional = true }
web_atoms = { version = "0.2.6", optional = true }

[features]
default = ["vga"]
js = ["dep:boa_engine"]
vga = ["dep:softbuffer", "dep:unifont-bitmap", "dep:winit"]
# M7: the Stylo cascade. Requires Python 3 on PATH — stylo's build.rs generates its property
# tables from vendored Mako templates.
stylo = [
    "dep:app_units",
    "dep:atomic_refcell",
    "dep:euclid",
    "dep:servo_arc",
    "dep:stylo",
    "dep:stylo_dom",
    "dep:stylo_traits",
    "dep:typed-arena",
    "dep:web_atoms",
]

[dev-dependencies]
insta = "1.48.0"
proptest = "1.11.0"
pretty_assertions = "1.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tempfile = "3.27.0"

[[bench]]
name = "selector_bucketing"
harness = false

[[bench]]
name = "linux_page"
harness = false

[profile.dev]
opt-level = 1
